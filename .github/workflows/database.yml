name: database
on:
  push:
    branches: [main]
    paths: ["database/**", ".github/workflows/database.yml"]
  pull_request:
    paths: ["database/**", ".github/workflows/database.yml"]
jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb:latest
        ports: ["6379:6379"]
    env:
      FALKORDB_HOST: 127.0.0.1
      FALKORDB_PORT: "6379"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ./database
      - run: python database/tests/smoke.py
