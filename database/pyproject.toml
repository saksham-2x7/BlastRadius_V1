[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blastradius-db"
version = "0.1.0"
description = "BlastRadius graph layer: FalkorDB connection, schema/seed data and account store"
requires-python = ">=3.12"
dependencies = ["falkordb==1.7.1"]

[tool.setuptools]
packages = ["blastradius_db"]
